<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aion: El Testigo del Tiempo</title>
<style>
body { font-family: system-ui, sans-serif; background: #0a0a0a; color: #e0e0e0; margin: 0; padding: 20px; text-align: center; }
.container { max-width: 800px; margin: 0 auto; }
h1 { color: #ffcc00; }
.sphere { display: inline-block; width: 150px; height: 150px; border-radius: 50%; margin: 20px; background: radial-gradient(circle, #ffcc00, #333); box-shadow: 0 0 30px #ffcc00; }
.pasado { background: radial-gradient(circle, #ffaa00, #333); }
.presente { background: radial-gradient(circle, #00ffff, #333); }
.futuro { background: radial-gradient(circle, #aa00ff, #333); }
button { background: #ffcc00; color: #000; border: none; padding: 15px 30px; font-size: 18px; cursor: pointer; border-radius: 5px; }
</style>
</head>
<body>
<div class="container">
<h1>AION</h1>
<h2>El Testigo del Tiempo</h2>
<p>Una máquina que muestra el pasado, el presente y el futuro.</p>
<div class="sphere pasado"></div>
<div class="sphere presente"></div>
<div class="sphere futuro"></div>
<br><br>
<button onclick="alert('Próximamente: la historia completa de Kael')">Ver la historia</button>
<p style="margin-top: 50px; font-size: 12px;">Proyecto de Eduardo Ruvalcaba</p>
</div>
</body>
</html>
